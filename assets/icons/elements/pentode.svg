<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <!-- Envelope -->
  <circle cx="0" cy="0" r="21" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Plate: lead and electrode -->
  <path d="M 0 -30 L 0 -16" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -8.5 -16 L 8.5 -16" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Suppressor, screen and control grids, top to bottom -->
  <path d="M -9 -10 L -6 -10 M -2 -10 L 2 -10 M 6 -10 L 9 -10" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -9 0 L -6 0 M -2 0 L 2 0 M 6 0 L 9 0" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -9 10 L -6 10 M -2 10 L 2 10 M 6 10 L 9 10" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Screen and control grid leads -->
  <path d="M -30 0 L -11.5 0" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -30 10 L -11.5 10" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cathode lead, then the cathode, its corner and the suppressor strap as one stroke -->
  <path d="M 0 30 L 0 16" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -8.5 16 L 8 16 C 10.209 16 12 14.209 12 12 L 12 -10" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
