<?xml version="1.0" encoding="UTF-8"?>
<!-- Oscilloscope probe: a screen with a trace on it, and two leads down to the
     pins it measures across.

     Schematic symbol artwork. The convention, which replacements must follow:
       * viewBox is -60 -60 120 120, and (0,0) is the part's CENTRE.
       * 10 SVG units = 1 grid square, so a pin at grid (0,-2) is at (0,-20).
         Pins are drawn by the canvas at the positions in Element.h, so artwork
         that ignores this will have its terminals land in the wrong place.
       * stroke-width 1.2 is the schematic's normal line weight. Heavier lines
         are multiples of it (1.56 = 1.3x, 1.8 = 1.5x); the app re-strokes at
         that ratio so lines stay visible when zoomed out.
       * Colour is ignored - everything is recoloured by the app.

     Pins are at grid (-2,2) and (2,2), i.e. (-20,20) and (20,20). The leads run
     up from those to the bottom corners of the screen. Pin 0, on the left, is
     the positive one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <rect x="-24" y="-22" width="48" height="34" rx="4" fill="none" stroke="#000" stroke-width="1.2"/>
  <path d="M -18 -3 L -11 -3 L -7 -13 L 1 7 L 5 -3 L 18 -3" fill="none" stroke="#000" stroke-width="1.56" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -20 20 L -20 12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 20 20 L 20 12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -17.6 15.6 L -12.4 15.6 M -15 13 L -15 18.2" fill="none" stroke="#000" stroke-width="1.56" stroke-linecap="round"/>
  <path d="M 12.4 15.6 L 17.6 15.6" fill="none" stroke="#000" stroke-width="1.56" stroke-linecap="round"/>
</svg>
