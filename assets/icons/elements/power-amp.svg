<?xml version="1.0" encoding="UTF-8"?>
<!-- Power amplifier (LM386): the op-amp's triangle, with its two gain pins
     brought out on top. The one on the left is pin 1 the feedback node,
     where the internal 15k from the output lands and the one on the right
     pin 8. The tick and the ring beside them are the pin numbers.

     Schematic symbol artwork. The convention, which replacements must follow:
       * viewBox is -60 -60 120 120, and (0,0) is the part's CENTRE.
       * 10 SVG units = 1 grid square, so a pin at grid (0,-2) is at (0,-20).
         Pins are drawn by the canvas at the positions in Element.h, so artwork
         that ignores this will have its terminals land in the wrong place.
       * stroke-width 1.2 is the schematic's normal line weight. Heavier lines
         are multiples of it (1.56 = 1.3x, 1.8 = 1.5x); the app re-strokes at
         that ratio so lines stay visible when zoomed out.
       * Colour is ignored - everything is recoloured by the app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <path d="M -22 -30 L 26 0 L -22 30 Z" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M -40 -20 L -22 -20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -40 20 L -22 20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 26 0 L 40 0" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -19 -20 L -11 -20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -15 -24 L -15 -16" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -19 20 L -11 20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -10 -40 L -10 -22.5" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 0 -40 L 0 -16.25" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -14 -36 L -14 -29 M -15.5 -34.5 L -14 -36" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="4.5" cy="-34.4" r="1.4" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="4.5" cy="-30.6" r="1.8" fill="none" stroke="#000" stroke-width="1"/>
</svg>
