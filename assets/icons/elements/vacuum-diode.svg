<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <!-- Envelope -->
  <circle cx="0" cy="0" r="21" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Plate: lead and electrode -->
  <path d="M 0 -30 L 0 -12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -8.5 -12 L 8.5 -12" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cathode lead, then the cathode with its upturned end -->
  <path d="M 0 30 L 0 12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -8.5 12 L 8 12 C 10.209 12 12 10.209 12 8" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
