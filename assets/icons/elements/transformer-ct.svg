<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <!-- Transformer, centre-tapped secondary -->
  <!-- Primary: leads and winding -->
  <path d="M -30 -30 L -12 -30 L -12 -18" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -30 30 L -12 30 L -12 18" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M -12 -18 A 4.5 4.5 0 0 0 -12 -9 A 4.5 4.5 0 0 0 -12 0 A 4.5 4.5 0 0 0 -12 9 A 4.5 4.5 0 0 0 -12 18" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Secondary: leads and winding -->
  <path d="M 30 -30 L 12 -30 L 12 -18" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30 30 L 12 30 L 12 18" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 12 -18 A 4.5 4.5 0 0 1 12 -9 A 4.5 4.5 0 0 1 12 0 A 4.5 4.5 0 0 1 12 9 A 4.5 4.5 0 0 1 12 18" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Centre tap -->
  <path d="M 12 0 L 30 0" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Core -->
  <path d="M -2.5 -20 L -2.5 20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 2.5 -20 L 2.5 20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Winding identity, counted rather than numbered so it survives rotation: one bar by the primary, two by the secondary -->
  <path d="M -7.25 -4 L -7.25 4" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 6 -4 L 6 4" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8.5 -4 L 8.5 4" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
