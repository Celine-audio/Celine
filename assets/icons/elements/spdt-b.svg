<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDT changeover, blade on throw B.

     Schematic symbol artwork. The convention, which replacements must follow:
       * viewBox is -60 -60 120 120, and (0,0) is the part's CENTRE.
       * 10 SVG units = 1 grid square, so a pin at grid (0,-2) is at (0,-20).
         Pins are drawn by the canvas at the positions in Element.h, so artwork
         that ignores this will have its terminals land in the wrong place.
       * stroke-width 1.2 is the schematic's normal line weight. Heavier lines
         are multiples of it (1.56 = 1.3x, 1.8 = 1.5x); the app re-strokes at
         that ratio so lines stay visible when zoomed out.
       * Colour is ignored - everything is recoloured by the app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120">
  <circle cx="0" cy="12" r="1.6" fill="#000"/>
  <circle cx="-10" cy="-12" r="1.6" fill="#000"/>
  <circle cx="10" cy="-12" r="1.6" fill="#000"/>
  <path d="M 0 12 L 10 -12" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 0 12 L 0 20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M -10 -12 L -10 -20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 10 -12 L 10 -20" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
</svg>
